<svg xmlns="http://www.w3.org/2000/svg" width="760" height="220" viewBox="0 0 760 220" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">Modal Sandboxes</title>
  <desc id="logo-desc">A terminal window inside a dashed sandbox boundary, next to the words Modal Sandboxes.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
  </defs>
  <rect width="760" height="220" rx="24" fill="#0f172a"/>
  <!-- the dashed line is the sandbox boundary: the sandbox is isolated and disposable -->
  <rect x="12" y="12" width="196" height="196" rx="36" fill="none" stroke="url(#accent)" stroke-width="4" stroke-dasharray="14 10"/>
  <!-- the terminal window is the sandbox's computer -->
  <rect x="42" y="52" width="136" height="116" rx="16" fill="#1e293b"/>
  <path d="M42 84 V68 A16 16 0 0 1 58 52 H162 A16 16 0 0 1 178 68 V84 Z" fill="url(#accent)"/>
  <circle cx="60" cy="68" r="5" fill="#f8fafc" fill-opacity="0.9"/>
  <circle cx="76" cy="68" r="5" fill="#f8fafc" fill-opacity="0.9"/>
  <circle cx="92" cy="68" r="5" fill="#f8fafc" fill-opacity="0.9"/>
  <text x="58" y="130" font-family="Menlo, Consolas, 'Courier New', monospace" font-size="40" font-weight="700" fill="url(#accent)">&gt;_</text>
  <text x="236" y="112" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" fill="#f8fafc">Modal Sandboxes</text>
  <text x="238" y="152" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#94a3b8">Disposable cloud computers, driven from code</text>
</svg>
